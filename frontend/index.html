<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Ninja - Interactive Motion Game</title>
  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Socket.IO client library -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #08080c;
      --primary-neon: #00f2fe; /* Cyan */
      --secondary-neon: #4facfe; /* Blue */
      --accent-neon: #ff007f; /* Neon pink */
      --success-neon: #39ff14; /* Neon green */
      --warning-neon: #ffb703; /* Yellow */
      --glass-bg: rgba(16, 16, 24, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8f9fa;
      --text-muted: #8e9297;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cyber-grid background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
      background-size: 45px 45px;
      background-position: center center;
      z-index: -1;
      pointer-events: none;
    }

    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .lobby-panel {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 
                  0 0 40px rgba(0, 242, 254, 0.15);
      overflow-y: auto;
      max-height: 95vh;
      text-align: center;
    }

    h1.title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 30%, var(--primary-neon) 70%, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 30px;
      font-weight: 300;
    }

    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 25px;
    }

    .qr-placeholder {
      width: 180px;
      height: 180px;
      background: white;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .qr-text {
      margin-top: 15px;
      font-size: 0.85rem;
      color: var(--text-main);
      word-break: break-all;
      line-height: 1.4;
    }

    .ip-address {
      font-family: monospace;
      color: var(--primary-neon);
      background: rgba(0, 242, 254, 0.08);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 5px;
    }

    /* Game Mode Options */
    .mode-select {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 25px;
    }

    .mode-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mode-btn span.mode-desc {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.8;
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
    }

    .mode-btn.active {
      background: rgba(0, 242, 254, 0.08);
      border-color: var(--primary-neon);
      color: var(--primary-neon);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .connection-status {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      padding: 15px;
      align-items: stretch;
      text-align: left;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      margin-bottom: 20px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.5s infinite alternate;
    }

    .status-dot.connected {
      background-color: var(--success-neon);
      box-shadow: 0 0 10px var(--success-neon);
    }

    @keyframes pulse {
      from { opacity: 0.4; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }

    .start-game-btn {
      background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
      border: none;
      border-radius: 12px;
      padding: 14px 40px;
      color: #000;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      max-width: 320px;
    }

    .start-game-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
    }

    .start-game-btn:active {
      transform: translateY(1px);
    }

    /* Landing Screen Overlay Styles */
    .landing-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050508;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Cyber grid background on landing */
    .landing-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center center;
      z-index: -1;
      pointer-events: none;
    }

    .landing-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .landing-content {
      text-align: center;
      max-width: 800px;
      width: 100%;
      padding: 20px;
    }

    .landing-title {
      font-size: 4.8rem;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff, var(--primary-neon), var(--secondary-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(0, 242, 254, 0.35);
      margin-bottom: 10px;
      animation: pulse-title 2s infinite alternate;
    }

    @keyframes pulse-title {
      from { transform: scale(0.98); opacity: 0.95; }
      to { transform: scale(1.02); opacity: 1; }
    }

    .landing-subtitle {
      color: var(--text-muted);
      font-size: 1.25rem;
      font-weight: 300;
      margin-bottom: 60px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .landing-modes {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .landing-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 2px solid var(--glass-border);
      border-radius: 20px;
      padding: 30px 40px;
      width: 320px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-family: inherit;
    }

    .landing-btn:hover {
      background: rgba(0, 242, 254, 0.05);
      border-color: var(--primary-neon);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.3);
      transform: translateY(-8px);
    }

    .landing-btn.dual-btn:hover {
      background: rgba(255, 0, 127, 0.05);
      border-color: var(--accent-neon);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.3);
    }

    .btn-icon {
      font-size: 3.5rem;
    }

    .landing-btn:hover .btn-icon {
      animation: bounce-icon 0.6s infinite alternate;
    }

    @keyframes bounce-icon {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .landing-btn:hover .btn-title {
      color: var(--primary-neon);
    }

    .landing-btn.dual-btn:hover .btn-title {
      color: var(--accent-neon);
    }

    .btn-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Landing Screen Overlay -->
  <div id="landing-screen" class="landing-overlay">
    <div class="landing-content">
      <h1 class="landing-title">Neon Ninja</h1>
      <p class="landing-subtitle">WiFi Motion-Controlled Slicing Game</p>
      
      <div class="landing-modes">
        <button class="landing-btn" onclick="selectGameMode(1)">
          <div class="btn-icon">👤</div>
          <div class="btn-text">
            <span class="btn-title">Solo Play</span>
            <span class="btn-subtitle">Single Sword Action</span>
          </div>
        </button>
        
        <button class="landing-btn dual-btn" onclick="selectGameMode(2)">
          <div class="btn-icon">👥</div>
          <div class="btn-text">
            <span class="btn-title">Dual Play</span>
            <span class="btn-subtitle">Split-Screen Duel</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <div class="main-container">
    <!-- Right Side: Dynamic Lobby Config -->
    <div class="lobby-panel">
      <div>
        <h1 class="title">Neon Ninja</h1>
        <p class="subtitle">WiFi Motion-Controlled Slicing Game</p>
      </div>

      <!-- Mode Selector -->
      <div class="mode-select">
        <button class="mode-btn active" id="mode-1player" onclick="setPlayerCount(1)">
          1 Player
          <span class="mode-desc">Single Sword</span>
        </button>
        <button class="mode-btn" id="mode-2player" onclick="setPlayerCount(2)">
          2 Players
          <span class="mode-desc">Split-Screen Duel</span>
        </button>
      </div>

      <!-- Scan QR section -->
      <div class="qr-section">
        <div class="qr-placeholder" id="qr-code">
          <!-- QR code generated here -->
        </div>
        <div class="qr-text">
          Connect phone to local WiFi, scan QR or go to:<br>
          <span class="ip-address" id="connect-link">Finding server IP...</span>
        </div>
      </div>

      <!-- Connection roster -->
      <div class="connection-status" id="connection-status-box">
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 800; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px;">
          <span class="status-dot" id="connection-status-dot"></span>
          <span id="connection-status-text">Waiting for players...</span>
        </div>
        <div id="player-lobby-list" style="display: flex; flex-direction: column; gap: 6px;">
          <div style="color: var(--text-muted); font-size: 0.9rem;">No players joined yet.</div>
        </div>
        <div id="lobby-queue-info" style="font-size: 0.8rem; color: var(--accent-neon); margin-top: 4px; display: none;">
          Queue: <span id="queue-count-val">0</span> in waiting room
        </div>
      </div>

      <!-- Open Game Tab Button -->
      <div>
        <button id="open-game-btn" class="start-game-btn" onclick="openGameWindow()">Open Game Screen</button>
      </div>
    </div>
  </div>

  <!-- Force unregister old Service Workers and clear caches -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister().then(function() {
            console.log("Old Service Worker unregistered successfully.");
          });
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <!-- Lobby pairing logic -->
  <script src="/lobby.js"></script>
</body>
</html>
