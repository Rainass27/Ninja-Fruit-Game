<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Ninja - Interactive Motion Game</title>
  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Socket.IO client library -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #08080c;
      --primary-neon: #00f2fe; /* Cyan */
      --secondary-neon: #4facfe; /* Blue */
      --accent-neon: #ff007f; /* Neon pink */
      --success-neon: #39ff14; /* Neon green */
      --warning-neon: #ffb703; /* Yellow */
      --glass-bg: rgba(16, 16, 24, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8f9fa;
      --text-muted: #8e9297;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cyber-grid background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
      background-size: 45px 45px;
      background-position: center center;
      z-index: -1;
      pointer-events: none;
    }

    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .lobby-panel {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .lobby-header {
      margin-bottom: 20px;
    }

    h1.title {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff 30%, var(--primary-neon) 70%, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.25rem;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* Two-column layout */
    .lobby-content-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      width: 100%;
      margin: auto 0;
    }

    .qr-section {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 380px;
    }

    .qr-placeholder {
      width: 220px;
      height: 220px;
      background: white;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .qr-text {
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .ip-address {
      font-family: monospace;
      color: var(--primary-neon);
      background: rgba(0, 242, 254, 0.08);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 8px;
    }

    .steps-section {
      display: flex;
      flex-direction: column;
      gap: 25px;
      max-width: 500px;
      text-align: left;
    }

    .step-card {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .step-num {
      background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
      color: #000;
      font-size: 1.5rem;
      font-weight: 800;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .step-info h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .step-info p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .lobby-footer {
      margin-top: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .connection-status {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px 30px;
      display: inline-block;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-neon);
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1.5s infinite alternate;
    }

    .status-dot.connected {
      background-color: var(--success-neon);
      box-shadow: 0 0 10px var(--success-neon);
    }

    @keyframes pulse {
      from { opacity: 0.4; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }

    .start-game-btn {
      background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
      border: none;
      border-radius: 12px;
      padding: 14px 40px;
      color: #000;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      max-width: 320px;
    }

    .start-game-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
    }

    .start-game-btn:active {
      transform: translateY(1px);
    }

    /* Splash Screen Overlay Styles */
    .splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050508;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
      opacity: 1;
    }

    .splash-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Cyber grid background on splash */
    .splash-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center center;
      z-index: -1;
      pointer-events: none;
    }

    .splash-title {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff, var(--primary-neon), var(--secondary-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(0, 242, 254, 0.35);
      margin-bottom: 5px;
      animation: pulse-title 2.5s infinite alternate;
    }

    .splash-subtitle {
      color: var(--text-muted);
      font-size: 1.3rem;
      font-weight: 300;
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    .progress-bar-outer {
      width: 320px;
      height: 24px;
      border: 3px solid #5d5d81;
      border-radius: 6px;
      padding: 3px;
      background: #08080c;
      box-shadow: 0 0 10px rgba(93, 93, 129, 0.3);
    }

    .progress-bar-inner {
      width: 0%;
      height: 100%;
      background: var(--accent-neon);
      border-radius: 2px;
      box-shadow: 0 0 15px var(--accent-neon);
      animation: fill-progress 2s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }

    @keyframes fill-progress {
      0% { width: 0%; }
      20% { width: 15%; }
      45% { width: 45%; }
      75% { width: 85%; }
      100% { width: 100%; }
    }

    .loading-text {
      margin-top: 15px;
      font-family: monospace;
      color: var(--accent-neon);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
      animation: flash 1.5s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
</head>
<body>

  <!-- Splash Screen / Game Loading Overlay -->
  <div id="splash-screen" class="splash-overlay">
    <h1 class="splash-title">Neon Ninja</h1>
    <p class="splash-subtitle">WiFi Motion-Controlled Slicing Game</p>
    <div class="progress-container">
      <div class="progress-bar-outer">
        <div class="progress-bar-inner"></div>
      </div>
      <div class="loading-text">LOADING...</div>
    </div>
  </div>

  <div class="main-container">
    <!-- Right Side: Dynamic Lobby Config -->
    <div class="lobby-panel">
      <!-- Title Header -->
      <div class="lobby-header">
        <h1 class="title">Neon Ninja</h1>
        <p class="subtitle">WiFi Motion-Controlled Slicing Game</p>
      </div>

      <!-- Main Config/QR Row -->
      <div class="lobby-content-row">
        <!-- QR Section (Left Column) -->
        <div class="qr-section">
          <div class="qr-placeholder" id="qr-code">
            <!-- QR code generated here -->
          </div>
          <div class="qr-text">
            Scan QR or go to:<br>
            <span class="ip-address" id="connect-link">Finding server IP...</span>
          </div>
        </div>

        <!-- Instructions Steps (Right Column) -->
        <div class="steps-section">
          <div class="step-card">
            <div class="step-num">1</div>
            <div class="step-info">
              <h3>Connect Your Phone</h3>
              <p>Scan the QR code or open the link. Enter your name and tap Join Lobby to begin.</p>
            </div>
          </div>
          <div class="step-card">
            <div class="step-num">2</div>
            <div class="step-info">
              <h3>Swing to Slash!</h3>
              <p>Hold your phone like a sword and swing it to slash flying fruits in real-time!</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Connection roster & Status -->
      <div class="lobby-footer">
        <div class="connection-status" id="connection-status-box">
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; color: var(--text-muted);">
            <span class="status-dot" id="connection-status-dot"></span>
            <span id="connection-status-text">Waiting for players...</span>
          </div>
          <div id="player-lobby-list" style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px; min-width: 250px;">
            <div style="color: var(--text-muted); font-size: 0.9rem;">No players joined yet.</div>
          </div>
        </div>

        <!-- Open Game Tab Button -->
        <div style="margin-top: 15px;">
          <button id="open-game-btn" class="start-game-btn" onclick="openGameWindow()" style="width: auto; padding: 12px 30px; font-size: 0.95rem;">Open Game Screen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Force unregister old Service Workers and clear caches -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister().then(function() {
            console.log("Old Service Worker unregistered successfully.");
          });
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <!-- Lobby pairing logic -->
  <script src="/lobby.js"></script>
</body>
</html>
